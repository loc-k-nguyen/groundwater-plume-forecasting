name: CPU reproducibility checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.9.25"
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-cpu-lock.txt
      - name: Verify source and immutable evidence
        run: |
          python scripts/check_release.py
          python scripts/build_manifest.py --check
          python scripts/validate_release_artifacts.py
          python scripts/verify_revision_evidence.py
      - name: Run CPU regressions and entry points
        run: |
          python -m unittest discover -s tests -v
          for script in train_ta_anp export_prediction_cache compute_plume_metrics run_naive_baselines paired_significance_tests make_figures build_manifest validate_release_artifacts; do
            python scripts/$script.py --help
          done
      - name: Reproduce lightweight summaries and aggregate plots
        run: |
          python scripts/reproduce_summaries.py --out-dir outputs/reproduction
          python scripts/make_figures.py --out_dir outputs/reproduction/figures
          python scripts/make_research_overview.py --out-dir outputs/reproduction/overview
          python scripts/build_manifest.py --check
      - name: Write verification summary
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import unittest
          loader = unittest.TestLoader()
          count = loader.discover('tests').countTestCases()
          assert not loader.errors, loader.errors
          commit = os.environ['GITHUB_SHA']
          text = f'''## CPU reproducibility checks passed

          Tested commit: `{commit}`

          | Verification | Result |
          |---|---|
          | CPU regression suite | {count} tests passed |
          | Source parsing, release scope and immutable evidence | Passed |
          | Saved SHA-256 manifest | Passed |
          | Six primary statistical comparisons | Recomputed and matched |
          | Eight CLI entry points | Passed |
          | Grouped statistics and diagnostic summaries | Reproduced |
          | Aggregate plots and research overview | Rendered on CPU |

          Scope: data-free verification. No model training, restricted-data evaluation or GPU workload.
          '''
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as handle:
              handle.write(text)
          PY
